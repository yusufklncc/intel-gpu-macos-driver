# Xe probe stick boot menu. ASCII only: GRUB's EFI text console shows anything else as '?'.
set timeout=10
set default=0
insmod all_video
insmod efi_gop
# keep the firmware's frame buffer: the kernel's simpledrm shows the text until the GPU driver takes over
set gfxpayload=keep

# panic=30 softlockup_panic=1 hung_task_panic=1 nmi_watchdog=panic: a driver bind that wedges the kernel ends in a
# reboot after 30 s instead of a frozen screen; the stage file on the stick then skips that step on the next boot.
# efi_pstore.pstore_disable=1: a panic never writes the kernel log into firmware variables.
set common="rdinit=/init console=tty0 quiet loglevel=3 log_buf_len=8M panic=30 softlockup_panic=1 hung_task_panic=1 nmi_watchdog=panic efi_pstore.pstore_disable=1"

menuentry "Xe probe stick: scan this computer" {
	linux /boot/vmlinuz $common xestick.mode=full
	initrd /boot/initramfs.img
}
menuentry "Xe probe stick: safe scan (no GPU driver; use it if the scan above froze)" {
	linux /boot/vmlinuz $common nomodeset xestick.mode=safe
	initrd /boot/initramfs.img
}
menuentry "Xe probe stick: shell (for developers; every other disk read-only)" {
	linux /boot/vmlinuz $common xestick.mode=shell
	initrd /boot/initramfs.img
}
menuentry "Turn this computer off" {
	halt
}
