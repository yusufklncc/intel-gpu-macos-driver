# Everything the Xe probe stick image is built from, pinned. One entry per line: KIND NAME SHA256 URL
#   image     a Docker image, by digest (SHA256 column unused)
#   epoch     the time every file in the image carries (seconds since 1970); move it when this file changes
#   kernel    the kernel package; firmware: the GPU firmware package (Arch Linux Archive: these URLs never move)
#   apk       an Alpine package that goes into the image (unpacked, never installed)
#   tool      an Alpine package the build runs whose output ships (GRUB makes BOOTX64.EFI)
#   license   a licence text that travels on the stick (SPDX license-list-data, by tag)
# The build downloads each file to out/cache/ and stops if a SHA-256 differs. Alpine removes a package file from its
# mirror when it ships a fix; then `build.sh lock` prints new apk/tool lines (out/cache keeps the old files meanwhile).
