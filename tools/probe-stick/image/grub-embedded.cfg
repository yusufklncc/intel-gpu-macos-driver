# Built into BOOTX64.EFI (grub-mkimage -c). Finds the stick by its marker file, never by disk number (which changes
# from machine to machine), and hands over to the menu on the stick.
search --no-floppy --file --set=root /xe-probe-stick.marker
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
