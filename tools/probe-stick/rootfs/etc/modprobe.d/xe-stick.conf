# The GPU drivers load only in the trace step (scan.sh loads them by name, with automatic binding off).
blacklist xe
blacklist i915
# This image has no network, Wi-Fi or Bluetooth driver; these lines matter only if one ever slips in.
install cfg80211 /bin/false
install mac80211 /bin/false
install bluetooth /bin/false
install btusb /bin/false
