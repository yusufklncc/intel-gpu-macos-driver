# SPDX-License-Identifier: MIT
# Builds IntelXe Manager for Windows (windows/app) and runs its Core tests (the shared EFI rule vectors among them) on
# a Windows runner; the self-contained zip and its .sha256 are kept as a build artifact (release/package.sh takes them
# as WINAPP_ZIP). The Core compiles IntelXe-EFI.ps1's engine and
# embeds efi-rules.json, so a change to either runs it too; build.ps1 puts windows/efibuild beside the app (engine\). It
# publishes nothing and makes no release.
name: Windows app
on:
  push:
    paths: ["windows/app/**", "windows/efibuild/**", "windows/IntelXe-EFI.ps1", "windows/test/stage1/**", "release/templates/efi-rules.json", "release/efi-rules-vectors.json", "efi/sample-z790/config.plist", "data/platforms.json", "tools/report/collect-windows.ps1", ".github/workflows/windows-app.yml"]
  pull_request:
    paths: ["windows/app/**", "windows/efibuild/**", "windows/IntelXe-EFI.ps1", "windows/test/stage1/**", "release/templates/efi-rules.json", "release/efi-rules-vectors.json", "efi/sample-z790/config.plist", "data/platforms.json", "tools/report/collect-windows.ps1", ".github/workflows/windows-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build, test and publish
        shell: pwsh
        run: ./windows/app/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: IntelXeManager-win-x64
          path: |
            windows/app/out/*.zip
            windows/app/out/*.zip.sha256
          if-no-files-found: error
